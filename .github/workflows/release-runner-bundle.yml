name: Release Runner Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runner bundle
        run: npm run bundle --workspace=packages/attack-lab

      - name: Verify bundle runs
        run: node packages/attack-lab/dist/runner.js --help

      - name: Upload runner.js as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: packages/attack-lab/dist/runner.js
